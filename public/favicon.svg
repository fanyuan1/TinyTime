<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ccd1"/>
      <stop offset="0.5" stop-color="#8b9099"/>
      <stop offset="1" stop-color="#5c626b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#c81f16"/>
    </linearGradient>
  </defs>

  <!-- feet -->
  <g stroke="#5c626b" stroke-width="4" stroke-linecap="round">
    <line x1="17" y1="52" x2="12" y2="60"/>
    <line x1="47" y1="52" x2="52" y2="60"/>
  </g>

  <!-- bells -->
  <g stroke="#4a4f57" stroke-width="1.5">
    <ellipse cx="17" cy="13" rx="10" ry="9" fill="url(#bell)"/>
    <ellipse cx="47" cy="13" rx="10" ry="9" fill="url(#bell)"/>
  </g>
  <!-- striker / top hammer -->
  <path d="M28 7 Q32 2 36 7" fill="none" stroke="#4a4f57" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="2.6" fill="#5c626b"/>

  <!-- clock body -->
  <circle cx="32" cy="36" r="23" fill="url(#rim)" stroke="#a2160f" stroke-width="1.5"/>
  <circle cx="32" cy="36" r="17.5" fill="#f7f7f4" stroke="#e2e2dd" stroke-width="1"/>

  <!-- tick marks -->
  <g stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="21.5" x2="32" y2="25"/>
    <line x1="32" y1="47" x2="32" y2="50.5"/>
    <line x1="17.5" y1="36" x2="21" y2="36"/>
    <line x1="43" y1="36" x2="46.5" y2="36"/>
    <line x1="21.6" y1="25.6" x2="24" y2="28"/>
    <line x1="40" y1="44" x2="42.4" y2="46.4"/>
    <line x1="42.4" y1="25.6" x2="40" y2="28"/>
    <line x1="24" y1="44" x2="21.6" y2="46.4"/>
  </g>

  <!-- hands (10:10) -->
  <g stroke="#1f1f1f" stroke-linecap="round">
    <line x1="32" y1="36" x2="24" y2="28" stroke-width="2.4"/>
    <line x1="32" y1="36" x2="40" y2="29" stroke-width="2.4"/>
  </g>
  <circle cx="32" cy="36" r="2.4" fill="#c81f16"/>
</svg>
