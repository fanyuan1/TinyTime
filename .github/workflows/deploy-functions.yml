name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy_functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Create functions .env
        run: echo "RESEND_KEY=${{ secrets.RESEND_KEY }}" > functions/.env

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENGSIGHTLABS }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy functions
        run: npx --yes firebase-tools@latest deploy --only functions --project engsightlabs --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
